name: Release HiFrame

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag / 已推送的版本标签，例如 v0.5.1'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases so an older concurrent run cannot replace Latest.
concurrency:
  group: hiframe-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main-branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          echo "HIFRAME_RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Test, package, and verify
        run: bash scripts/ci-package.sh
      - name: Publish verified release assets
        run: python3 scripts/publish-release.py "$RELEASE_TAG"
