name: Build HiFrame

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test, package, and verify
        run: bash scripts/ci-package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HiFrame-macOS-arm64
          path: |
            downloads/HiFrame.zip
            downloads/HiFrame.zip.sha256
          if-no-files-found: error
          retention-days: 14
